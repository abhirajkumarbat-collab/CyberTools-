name: Build CyberTool APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4

    - name: Safe Locate and Build APK
      run: |
        # Search for any Gradle build or settings file safely
        TARGET_FILE=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) | head -n 1)

        if [ -n "$TARGET_FILE" ]; then
          PROJECT_DIR=$(dirname "$TARGET_FILE")
        else
          PROJECT_DIR="."
        fi

        echo "Project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Create settings file if completely missing
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          echo 'rootProject.name = "CyberTool"' > settings.gradle.kts
          if [ -d "app" ]; then
            echo 'include(":app")' >> settings.gradle.kts
          fi
        fi

        # Generate wrapper if missing
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

        # Execute debug build
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CyberTool-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
