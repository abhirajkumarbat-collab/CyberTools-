name: Build CyberTool APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4

    - name: Locate Project and Build APK
      run: |
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1))
        echo "Found project directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CyberTool-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
